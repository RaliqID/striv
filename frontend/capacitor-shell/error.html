<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Striv — Connection problem</title>
<style>
  /* Same constraints as index.html: bundled, offline, no dependencies. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    background: #FDF8F8; color: #1C1B1B;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand strong { font-size: 26px; font-weight: 900; letter-spacing: -0.03em; }
  .icon { width: 52px; height: 52px; border-radius: 50%; background: #F9DEDC;
          display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
          font-size: 26px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: #49454F; line-height: 1.55; font-size: 15px; }
  .addr { display: block; margin: 16px 0 22px; padding: 13px 15px; border-radius: 10px;
          background: #EEEAEA; color: #1C1B1B; font-family: ui-monospace, monospace;
          font-size: 13px; word-break: break-all; }
  button {
    width: 100%; padding: 16px; font-size: 15px; font-weight: 700; border: 0;
    border-radius: 12px; background: #1C1B1B; color: #fff; cursor: pointer;
  }
  button:active { transform: scale(0.985); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
      <rect width="40" height="40" rx="11" fill="#1C1B1B"/>
      <rect x="10" y="22" width="4.5" height="8" rx="2.25" fill="#fff" opacity=".55"/>
      <rect x="17.75" y="17" width="4.5" height="13" rx="2.25" fill="#fff" opacity=".8"/>
      <rect x="25.5" y="11" width="4.5" height="19" rx="2.25" fill="#fff"/>
      <path d="M14.5 14.5L20 9.5L25.5 14.5" stroke="#6063EE" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <strong>Striv</strong>
  </div>

  <div class="icon" aria-hidden="true">⚠️</div>
  <h1>Cannot reach the server</h1>
  <p>The app could not connect to the address it was last given. The server may
     have stopped, or its address may have changed.</p>
  <span class="addr" id="addr">—</span>
  <p>Set a new address to continue.</p>

  <button id="change">Change server address</button>
</div>

<script>
/*
 * Loaded by Capacitor when server.url fails to respond (server.errorPath).
 *
 * Its only job is to make a broken address recoverable. Without it, a stale URL
 * leaves the user on a blank WebView with no way to fix it short of clearing
 * app data — which is exactly the trap that made the app need rebuilding every
 * time a dev tunnel restarted.
 */
const STORAGE_KEY = "striv.server.url";

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) document.getElementById("addr").textContent = saved;
} catch (e) {
  document.getElementById("addr").textContent = "unknown";
}

document.getElementById("change").addEventListener("click", () => {
  // index.html shows the form when setServer=1, even if a URL is stored.
  window.location.replace("index.html?setServer=1");
});
</script>
</body>
</html>
