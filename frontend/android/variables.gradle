ext {
    /*
     * minSdk 26 (Android 8.0). Capacitor's default is 24, but 26 is the
     * practical floor for an adaptive-icon-only app: the adaptive icon
     * (mipmap-anydpi-v26) and the modern WebView APIs the app relies on are
     * only guaranteed from 26. Devices below that are a rounding error of the
     * Play install base.
     */
    minSdkVersion = 26

    // targetSdk must meet the level Google requires for new Play submissions;
    // Play rejects uploads targeting an older API. Revisit with each release.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}