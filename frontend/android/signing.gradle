// Release signing configuration.
//
// The keystore is NEVER committed. Play uses the key's fingerprint to identify
// the app, so losing it means you cannot ship updates under the same listing —
// keep a backup outside the repo.
//
// Create a keystore once:
//   keytool -genkey -v -keystore striv-upload.jks -keyalg RSA -keysize 2048 \
//           -validity 10000 -alias striv
//
// Then put these in android/keystore.properties (git-ignored):
//   storeFile=../striv-upload.jks
//   storePassword=...
//   keyAlias=striv
//   keyPassword=...

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()

if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Only wire the release signing config when a keystore is present,
            // so a contributor without one can still run assembleDebug.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail the release build if signing is missing, rather than producing an
// unsigned bundle that Play will reject after a long upload.
tasks.matching { it.name == "bundleRelease" || it.name == "assembleRelease" }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "Release signing is not configured. Create android/keystore.properties " +
                "(see android/signing.gradle) or build a debug APK with assembleDebug."
            )
        }
    }
}
